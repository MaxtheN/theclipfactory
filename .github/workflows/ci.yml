name: Test local MVP
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Install FFmpeg (media tests render real clips)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          else
            brew install ffmpeg
          fi
          ffmpeg -hide_banner -filters | grep -E ' (ass|subtitles|drawtext|loudnorm) ' || true
      - name: Backend and launcher tests (no native GUI)
        run: |
          python -m pip install '.[test]' 'setuptools>=75' wheel
          python -m pytest tests scripts/tests -q
          python -m ruff check clip_factory scripts
      - name: Native private Python bootstrap smoke
        if: runner.os == 'macOS'
        run: python scripts/smoke-managed-python.py
      - name: Headless bootstrap smoke (not a native desktop test)
        run: python scripts/smoke-headless.py
