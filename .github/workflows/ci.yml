name: Test local MVP
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on Windows, so every platform runs the same commands.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Install FFmpeg with libass (media tests burn real captions)
        run: |
          case "$RUNNER_OS" in
            Linux)
              # libegl1/libgles2: MediaPipe face landmarks (faces.py) load them on Linux.
              sudo apt-get update -q && sudo apt-get install -y -q ffmpeg bubblewrap libegl1 libgles2 ;;
            macOS)
              # Homebrew's default ffmpeg has no libass/drawtext; the keg-only ffmpeg-full does,
              # and it is the build the app prefers (media.FULL_FFMPEG_DIRS).
              brew install ffmpeg-full
              echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH" ;;
            Windows)
              # Gyan's build (Chocolatey) includes libass and fontconfig.
              choco install ffmpeg -y --no-progress
              echo "/c/ProgramData/chocolatey/bin" >> "$GITHUB_PATH" ;;
          esac
      - name: Check FFmpeg can burn captions
        run: |
          ffmpeg -hide_banner -version | head -1
          ffmpeg -hide_banner -filters | grep -E ' (ass|subtitles|drawtext|loudnorm) '
      - name: Backend and launcher tests (no native GUI)
        run: |
          python -m pip install '.[test]' 'setuptools>=75' wheel
          python -m pytest tests scripts/tests -q
          python -m ruff check clip_factory scripts
      - name: Native private Python bootstrap smoke
        if: runner.os == 'macOS'
        run: python scripts/smoke-managed-python.py
      - name: Headless bootstrap smoke (not a native desktop test)
        run: python scripts/smoke-headless.py
  posting-server:
    # The Zernio posting Edge Function (supabase/functions/posting); platform-independent.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format, lint and type-check
        run: |
          deno fmt --check posting/
          deno lint posting/
          deno check posting/index.ts posting/handler_test.ts
      - name: Tests
        run: deno test posting/
