name: Test local MVP
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Backend and launcher tests (no native GUI)
        run: |
          python -m pip install '.[test]' 'setuptools>=75' wheel
          python -m pytest tests scripts/tests -q
          python -m ruff check clip_factory scripts
      - name: Headless bootstrap smoke (not a native desktop test)
        run: python scripts/smoke-headless.py
