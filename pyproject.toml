[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clip-factory"
version = "0.1.0"
description = "Local-first Instagram content factory for Apple Silicon"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20", "httpx>=0.28,<1", "certifi>=2025.1.31", "platformdirs>=4,<5", "keyring>=25,<26", "huggingface-hub>=0.30,<2", "psutil>=6,<8", "pyobjc-framework-Vision>=10,<14; sys_platform == 'darwin'"]

[project.optional-dependencies]
desktop = ["pywebview>=5,<7"]
test = ["pytest>=8,<10", "ruff>=0.11,<1", "setuptools>=75", "wheel>=0.45", "numpy>=1.26,<3"]

[project.scripts]
clip-factory = "clip_factory.main:main"

[tool.setuptools.packages.find]
include = ["clip_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.setuptools.package-data]
clip_factory = ["ui/*", "ui/**/*", "demo_ui/*", "fonts/*", "inference_worker.py", "cloud_config.json"]
